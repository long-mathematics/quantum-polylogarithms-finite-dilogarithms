name: PR5 PDF sync

on:
  push:
    branches: [docs/final-citation-claim-audit]

permissions:
  contents: write

jobs:
  sync:
    if: "!contains(github.event.head_commit.message, 'Rebuild PDFs after final citation audit')"
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install TeX and Python requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexmk texlive-latex-extra texlive-fonts-recommended lmodern
          python -m pip install -r requirements.txt
      - name: Rebuild tracked PDFs and citation report
        run: |
          make papers
          python scripts/check_manuscript_integrity.py --output verification/manuscript_integrity.json
      - name: Commit generated files and remove temporary workflow
        run: |
          set -euo pipefail
          rm .github/workflows/pr5-pdf-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add papers/quantum_polylogarithms.pdf papers/finite_quantum_dilogarithms.pdf verification/manuscript_integrity.json .github/workflows/pr5-pdf-sync.yml
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Rebuild PDFs after final citation audit"
          git push
