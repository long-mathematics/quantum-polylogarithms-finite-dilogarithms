name: Prepare citation revision
on:
  push:
    branches: [docs/concurrent-literature-audit]
    paths: [.github/workflows/prepare-citation-revision.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.ref == 'refs/heads/docs/concurrent-literature-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check base and apply source-preserving citation edits
        run: |
          git merge-base --is-ancestor d3cb0989d12988b507c6126e03488e0c2ebb2f78 HEAD
          python .github/maintenance/apply-citation-revision.py
          rm .github/maintenance/apply-citation-revision.py
          rm .github/workflows/prepare-citation-revision.yml
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq latexmk texlive-latex-extra texlive-fonts-recommended lmodern
          python -m pip install -r requirements.txt
      - name: Repeat all exact and numerical checks and build both manuscripts
        run: |
          make verify
          make papers
          if grep -En 'Overfull|LaTeX Warning:.*(undefined|multiply defined)|^!' papers/*.log; then
            echo 'LaTeX diagnostic check failed.'
            exit 1
          fi
          git diff --check
      - name: Commit sources, PDFs and verification reports to this branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Contextualize concurrent literature and rebuild checked manuscripts'
          git push origin HEAD:docs/concurrent-literature-audit
          git archive --format=zip --output=citation-checked-repository.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: citation-checked-repository
          path: citation-checked-repository.zip
          if-no-files-found: error
