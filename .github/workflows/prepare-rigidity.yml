name: Prepare audited rigidity revision

on:
  push:
    branches: [proof/hypothesis-3-1]

permissions:
  contents: write

jobs:
  prepare:
    if: github.event.head_commit.message == 'Prepare checked rigidity revision payload'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: proof/hypothesis-3-1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply checksum-verified manuscript revision
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          cat .github/rigidity-preparation/0*.part > /tmp/rigidity-revision.patch
          echo 'a32757f1b3ce1c7d4fa28c7a7459b36f01e20312c4d5a6abf0e3ea8d2784af80  /tmp/rigidity-revision.patch' | sha256sum --check
          git apply --check --index /tmp/rigidity-revision.patch
          git apply --index /tmp/rigidity-revision.patch
          git rm -r .github/rigidity-preparation
          git diff --cached --check
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexmk texlive-latex-extra texlive-fonts-recommended lmodern
          python -m pip install -r requirements.txt
      - name: Verify exact certificates and analytic conventions
        run: make verify
      - name: Rebuild both tracked manuscripts
        run: make papers
      - name: Check sources and LaTeX diagnostics
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          record = json.loads(Path('verification/RIGIDITY_REVISION_CHECKS.json').read_text())
          for name, expected in record['source_sha256'].items():
              actual = hashlib.sha256(Path(name).read_bytes()).hexdigest()
              assert actual == expected, (name, actual, expected)
          PY
          if grep -E 'Overfull|LaTeX Warning:.*(undefined|multiply defined)|^!' papers/*.log; then
            echo 'Unresolved LaTeX diagnostics' >&2
            exit 1
          fi
          git diff --check
          git diff --cached --check
      - name: Commit the checked revision and rebuilt PDFs
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add papers/*.pdf verification/
          git commit -m 'Prove normalized dual-number realization and finite etaleness'
          git push origin HEAD:proof/hypothesis-3-1
      - uses: actions/upload-artifact@v4
        with:
          name: audited-rigidity-preparation
          path: |
            papers/*.pdf
            verification/
          if-no-files-found: error
